name: Daily Data Refresh

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 1pm UTC, Mon-Fri (markets closed weekends)
  workflow_dispatch:          # also can trigger it manually from GitHub's UI

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write FRED API key from GitHub secret
        run: echo "FRED_API_KEY = '${{ secrets.FRED_API_KEY }}'" > config.py

      - name: Run pipeline
        run: python main.py

      - name: Commit updated data + dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.csv dashboard_*.html
          git commit -m "Daily auto-update" || echo "No changes to commit"
          git push